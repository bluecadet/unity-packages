title: Unity
repoUrl: https://github.com/bluecadet/unity-packages
accent: "#b3a6db"
accent2: "#b3a6db"
landing: index.mdx

site: https://unity.bluecadet.com

content:
  # Cross-package pages that belong to no single package, authored in this docs
  # directory. `route` is set explicitly: `base` is stripped from the route, so
  # without it these would land at `/installing` rather than `/general/installing`.
  - base: general
    files: "**/*.md"
    route: general

  # Each package's docs are colocated with the package, in a Documentation~
  # directory that Unity ignores because of the trailing `~`. `base` points at
  # that directory rather than at the package root so the `Documentation~`
  # segment is stripped from every route — `base` is what gets stripped, not
  # `route`.
  #
  # No entry declares `assets`. Nothing is published implicitly, and no page in
  # this site references a non-markdown file, so leaving `assets` off keeps the
  # C# sources, shaders, .meta files and prebuilt native plugins that sit beside
  # these directories out of the published output.
  - base: ../Packages/com.bluecadet.hap/Documentation~
    files: "**/*.md"
    route: hap

  - base: ../Packages/com.bluecadet.launchpad/Documentation~
    files: "**/*.md"
    route: launchpad

  - base: ../Packages/com.bluecadet.spring/Documentation~
    files: "**/*.md"
    route: spring

  - base: ../Packages/com.bluecadet.touchscreen/Documentation~
    files: "**/*.md"
    route: touchscreen

  - base: ../Packages/com.bluecadet.uiblur/Documentation~
    files: "**/*.md"
    route: uiblur

  - base: ../Packages/com.bluecadet.uiblur-hdrp/Documentation~
    files: "**/*.md"
    route: uiblur-hdrp

  - base: ../Packages/com.bluecadet.utils/Documentation~
    files: "**/*.md"
    route: utils

