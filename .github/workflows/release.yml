name: Sign and Release

on:
  push:
    tags:
      - "com.bluecadet.*@*"

permissions:
  contents: write

jobs:
  sign-and-release:
    outputs:
      package-name: ${{ steps.tag.outputs.name }}
    name: Sign and Release
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      DIST_DIR: /tmp/upm-dist

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE_NAME="${TAG%@*}"
          PACKAGE_VERSION="${TAG##*@}"
          PACKAGE_DIR="Packages/${PACKAGE_NAME}"

          if [ ! -d "$PACKAGE_DIR" ]; then
            echo "::error::Package directory '$PACKAGE_DIR' not found for tag '$TAG'"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r '.version' "$PACKAGE_DIR/package.json")
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version '$PACKAGE_VERSION' does not match package.json version '$MANIFEST_VERSION'"
            exit 1
          fi

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Prepare changelog
        env:
          PACKAGE_DIR: ${{ steps.tag.outputs.dir }}
          PACKAGE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          CHANGELOG="$PACKAGE_DIR/CHANGELOG.md"
          HEADING="## [$PACKAGE_VERSION]"

          if ! grep -qF "$HEADING" "$CHANGELOG"; then
            echo "::error::$CHANGELOG does not contain a section for version $PACKAGE_VERSION"
            exit 1
          fi

          # Extract the section for this version (source for _upm.changelog below)
          awk -v heading="$HEADING" \
            '/^## \[/{if(found) exit; if(index($0,heading)==1) found=1} found' \
            "$CHANGELOG" > /tmp/release-notes.md

          # Strip markdown syntax for _upm.changelog (plain text, \n-delimited)
          # release-please writes linked/dated headings, e.g.
          # "## [1.2.0](.../compare/...) (2026-08-03)"; the extra two rules
          # below collapse that back to the plain "[1.2.0] - 2026-08-03"
          # form. They no-op on the older "[X.Y.Z] - date" style headings.
          PLAIN=$(sed \
            -e 's/^## \[/[/' \
            -e 's/\]([^)]*)/]/' \
            -e 's/^\(\[[0-9.]*\]\) (\([0-9-]*\))$/\1 - \2/' \
            -e 's/^### //' \
            /tmp/release-notes.md \
            | sed '/^$/{ N; /^\n$/d }')

          # Inject into package.json
          jq --arg changelog "$PLAIN" '._upm.changelog = $changelog' \
            "$PACKAGE_DIR/package.json" > /tmp/package.json \
            && mv /tmp/package.json "$PACKAGE_DIR/package.json"

      - name: Sign package
        env:
          PACKAGE_DIR: ${{ steps.tag.outputs.dir }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          mkdir -p "$DIST_DIR"
          upm pack "./$PACKAGE_DIR" \
            --organization-id "$UPM_ORG_ID" \
            --destination "$DIST_DIR"

      - name: Verify signature
        run: |
          archive=("$DIST_DIR"/*.tgz)
          tar -tzf "${archive[0]}" | grep -qx 'package/package.json'
          tar -tzf "${archive[0]}" | grep -qx 'package/.attestation.p7m'

      - name: Attach signed package to Release
        uses: softprops/action-gh-release@v2
        with:
          # release-please already created the GitHub Release (with its own
          # changelog-derived body) for this tag when the release PR merged.
          # softprops/action-gh-release updates that existing release rather
          # than creating a duplicate as long as we don't pass `body`/
          # `body_path`/`name`, so we only upload the signed tarball here.
          files: "${{ env.DIST_DIR }}/*.tgz"

  verify-openupm:
    name: Verify OpenUPM Publish
    needs: sign-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: openupm/openupm-action@v1.0.1
        with:
          package: ${{ needs.sign-and-release.outputs.package-name }}
          tag: ${{ github.ref_name }}
