name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT (RELEASE_PLEASE_TOKEN) is required here instead of the default
      # GITHUB_TOKEN: tags created by workflow runs using GITHUB_TOKEN don't
      # trigger other workflows, so the com.bluecadet.*@* push in
      # release.yml would never fire when release-please tags a release.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
